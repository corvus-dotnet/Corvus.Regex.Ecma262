MetaData:
  Title: "Corvus.Regex.Ecma262 — ECMA-262 regular expressions for .NET"
  Description: "A drop-in replacement for System.Text.RegularExpressions that answers as ECMAScript does, with performance equal to or better than .NET's on equivalent expressions: native UTF-8 and UTF-16 matching, zero allocation per match, and a build-time source generator."
  Keywords: [regex, regular expressions, ECMA-262, ECMAScript, .NET, C#, UTF-8, source generator, JSON Schema]
