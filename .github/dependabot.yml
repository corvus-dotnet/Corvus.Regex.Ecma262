version: 2
updates:
- package-ecosystem: nuget
  directory: /Solutions
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
# The harness image's base image, pinned by digest: one pull request a month moves it, so that the SDK and runtime the
# image measures change only by a merge.
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
