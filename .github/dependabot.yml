version: 2
updates:
- package-ecosystem: nuget
  directory: /Solutions
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
# The harness image's base image, pinned by digest: one pull request a month moves it, so that the SDK and runtime the
# image measures change only by a merge.
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  ignore:
    # Node is the V8 the test data was written with (manifest.json, "node"): its version moves with the data, by hand.
    - dependency-name: "node"
      update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    # A new major version of a compiler or runtime is a decision, not a monthly refresh.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
