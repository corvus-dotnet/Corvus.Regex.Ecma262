# The benchmark harness image: built and smoke-run on every pull request, every push to main and every release tag, and
# published to ghcr.io/corvus-dotnet/corvus-regex-ecma262-dotnet (`:latest` from main, the version tag from the tag's
# push). auto_release.yml pushes the tag with the endjin bot's token, which starts this workflow; the GitHub release it
# then makes with the workflow's own token starts nothing. A run by hand with a tag builds and publishes that release's
# image (to make one a release lacks). Built for linux/amd64 and linux/arm64, each natively on a runner of its own
# architecture, then joined into one multi-platform tag.
# This repository publishes no benchmark results of its own: the central benchmark site
# (https://corvus-oss.org/corvus-regex-ecma262-benchmarks/) runs this image each night on its runner, beside
# the engines of every other source, and is the one page of figures.
name: harness-image
on:
  push:
    branches:
    - main
    tags:
    - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: A release's tag, to build and publish that release's image
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: harness-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/corvus-dotnet/corvus-regex-ecma262-dotnet
  # The version: the tag pushed, the release's, or the one given by hand.
  VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.event.release.tag_name || '' }}

jobs:
  image:
    name: Build and run (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: "The record of a run with figures that have no time: stopped at the limit, an error, a differing count"
      # tools/benchmarks/record-check/README.md. The smoke run below never gives such a figure.
      run: |
        mkdir -p record-check
        c=record-check/compliance.json
        echo '{"right": 1, "wrong": 0, "refused": 0, "acceptedInvalid": 0, "limited": 0, "judge": {"runner": "https://example.com/runner", "calls": {"utf16": ["a"], "utf8": ["b"]}}, "excludes": []}' > "$c"
        python3 tools/benchmarks/industry-results.py --interleaved tools/benchmarks/record-check/run.json --commit check --date 2026-10-23 --host ci --out-dir record-check --compliance "$c" --compliance-v8 "$c"
        python3 - <<'PY'
        import json
        r = json.load(open("record-check/industry.json"))["results"]
        assert r[".NET interpreter"]["sherlock: zqj"] == {"limit": 30}, r[".NET interpreter"]["sherlock: zqj"]
        assert r["Corvus generated UTF-8"]["sherlock: aei"] == {"error": "a round gave no figure"}, r["Corvus generated UTF-8"]["sherlock: aei"]
        w = "sherlock: ^Sherlock Holmes|Sherlock Holmes$ /m"
        assert r[".NET generated"][w] == {"wrongCount": {"counted": 34, "v8": 37}}, r[".NET generated"][w]
        print("the record keeps a stopped figure and an error, and a count other than V8's is a wrong count")
        # An engine with no time on any workload, and a data-set runner that wrote no compliance file.
        d = json.load(open("tools/benchmarks/record-check/run.json"))
        d["results"]["net-generated"] = {w: {"error": "no workload of this harness has the pattern"} for w in d["results"]["net-generated"]}
        json.dump(d, open("record-check/run-untimed.json", "w"))
        PY
        python3 tools/benchmarks/industry-results.py --interleaved record-check/run-untimed.json --commit check --date 2026-10-23 --host ci --out-dir record-check/untimed --compliance record-check/no-such-file.json --compliance-v8 "$c"
        python3 - <<'PY'
        import json
        d = json.load(open("record-check/untimed/industry.json"))
        assert all("time" not in v for v in d["results"][".NET generated"].values())
        corvus = [i for i in d["impls"] if i["group"] not in (".NET", "V8")]
        assert corvus and all("compliance" not in i for i in corvus), corvus
        print("the record keeps an engine with no time anywhere, and engines with no compliance figure")
        PY
    - name: Build the harness image
      run: docker build --build-arg COMMIT="$(git rev-parse --short=7 HEAD)" -t harness .
    - name: "Smoke-run it: two workloads, the short job, as the central site runs it"
      run: |
        python3 tools/benchmarks/v8/workloads.py Solutions/Corvus.Regex.Ecma262.Benchmarks/Industry.cs > all.json
        python3 -c "import json; w=json.load(open('all.json')); json.dump([x for x in w if x['id'] in ('sherlock: aei','sherlock: zqj')], open('workloads.json','w'), ensure_ascii=False)"
        tools/benchmarks/texts.sh texts
        mkdir -p out && chmod 777 out
        docker run --rm -e JOB=short -e CORVUS_REGEX_WORKLOADS='aei,zqj' -v "$PWD/workloads.json:/workloads.json:ro" -v "$PWD/texts:/texts:ro" -v "$PWD/out:/out" harness
        python3 -c "import json; d=json.load(open('out/industry.json')); assert len(d['schemas']) == 2 and len(d['impls']) >= 6, d['schemas']; print('smoke run wrote', len(d['impls']), 'engines over', len(d['schemas']), 'workloads')"
    - name: "Count gate: every workload counted by this library beside V8, each count V8's"
      # A count that differs from V8's is a wrong answer, which the central page shows as a wrong count: it fails here,
      # on the pull request (tools/benchmarks/count-gate.py, run by run.sh with COUNT_GATE=1).
      run: |
        tools/benchmarks/texts.sh texts
        docker run --rm -e COUNT_GATE=1 -v "$PWD/all.json:/workloads.json:ro" -v "$PWD/texts:/texts:ro" -v "$PWD/out:/out" harness
    - name: Push this architecture's image
      # Under a tag of this run's alone; the publish job joins the two architectures into the tags the site pulls.
      if: github.ref == 'refs/heads/main' || env.VERSION != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTOR: ${{ github.actor }}
        ARCH: ${{ matrix.arch }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        docker tag harness "$IMAGE:build-$GITHUB_RUN_ID-$ARCH"
        docker push "$IMAGE:build-$GITHUB_RUN_ID-$ARCH"

  gate:
    # The check the ruleset of main requires: it passes when the image built and ran on both architectures.
    name: Harness image
    needs: image
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Both architectures passed
      env:
        RESULT: ${{ needs.image.result }}
      run: |
        if [ "$RESULT" != success ]; then echo "::error::The image job ended $RESULT."; exit 1; fi

  publish:
    name: Publish the image
    needs: image
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Join the architectures into one tag
      # `:latest` from main; the version's tag from a tag, a release or a run by hand that names one.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTOR: ${{ github.actor }}
        REF: ${{ github.ref }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        if [ -n "$VERSION" ]; then tag="$IMAGE:$VERSION"; elif [ "$REF" = refs/heads/main ]; then tag="$IMAGE:latest"; else exit 0; fi
        docker buildx imagetools create -t "$tag" "$IMAGE:build-$GITHUB_RUN_ID-amd64" "$IMAGE:build-$GITHUB_RUN_ID-arm64"
        docker buildx imagetools inspect "$tag"
