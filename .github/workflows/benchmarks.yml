# The Industry benchmarks, daily: every engine in one job on one runner, so that the figures of a run are comparable
# with each other. .NET's interpreter and source generator, this library's interpreter and source generator over
# UTF-16 and UTF-8 (BenchmarkDotNet, the default job), then V8 under Node 24 (tools/benchmarks/v8), then the record
# and the results page, published to the site at benchmarks/ci/ with the run's data kept under benchmarks/ci/runs/.
# The committed record (docs/benchmarks) is the pinned run and the reference; this is the run of the day.
name: benchmarks
on:
  schedule:
  - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: The BenchmarkDotNet job (default is the record's; short is for a quick look)
        type: choice
        options: [default, short]
        default: default

permissions:
  contents: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  industry:
    name: Industry benchmarks, every engine on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
    - name: Build the benchmarks
      run: dotnet build Solutions/Corvus.Regex.Ecma262.Benchmarks/Corvus.Regex.Ecma262.Benchmarks.csproj -c Release -m:4 -nr:false
    - name: Run the .NET and Corvus engines (BenchmarkDotNet)
      # The benchmark downloads the texts into the local application data directory on first use; V8 reads them there.
      run: |
        job='${{ github.event.inputs.job || 'default' }}'
        cd Solutions/Corvus.Regex.Ecma262.Benchmarks
        ./bin/Release/net10.0/Corvus.Regex.Ecma262.Benchmarks --filter '*GeneratedCount*' --job "$job" --artifacts "$GITHUB_WORKSPACE/run" > "$GITHUB_WORKSPACE/run.log" 2>&1 || { tail -50 "$GITHUB_WORKSPACE/run.log"; exit 1; }
        grep -E '^// \* Summary|^\| ' "$GITHUB_WORKSPACE/run.log" | head -5
    - name: Run V8 (Node 24)
      run: |
        python3 tools/benchmarks/v8/workloads.py Solutions/Corvus.Regex.Ecma262.Benchmarks/Industry.cs > workloads.json
        node --version
        node tools/benchmarks/v8/industry.mjs workloads.json 2 5 > v8.json 2> v8.log
        tail -3 v8.log
    - name: Write the record and the page
      run: |
        job='${{ github.event.inputs.job || 'default' }}'
        python3 tools/benchmarks/industry-results.py --run run --commit "${GITHUB_SHA::7}" --date "$(date -u +%FT%TZ)" --v8 v8.json --host ci --job "$job" --out-dir out --base-path /Corvus.Regex.Ecma262 --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        cp v8.json out/industry-v8.json
        python3 tools/benchmarks/results-page/generate_site.py --data out/industry.json --out out/index.html
        head -12 out/industry.md
    - name: Keep the run
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: industry-${{ github.run_id }}
        path: |
          out
          run/results
          run.log
          v8.log
    - name: Publish to the site
      # The page at benchmarks/ci/ is replaced and the run's data kept under benchmarks/ci/runs/; the rest of gh-pages
      # is untouched (.github/scripts/Update-GhPages.ps1).
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: ./.github/scripts/Update-GhPages.ps1 -Mode Benchmarks -Source out -RunName "$(Get-Date -AsUTC -Format yyyy-MM-dd)-$($env:GITHUB_SHA.Substring(0, 7))"
