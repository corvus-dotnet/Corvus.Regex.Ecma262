# The Industry benchmarks, daily: every engine in one job on one runner, so that the figures of a run are comparable
# with each other. .NET's interpreter and source generator, this library's interpreter and source generator over
# UTF-16 and UTF-8 (BenchmarkDotNet, the default job), then V8 under Node 24 (tools/benchmarks/v8), then the record
# and the results page, published to the site at benchmarks/ci/ with the run's data kept under benchmarks/ci/runs/.
# The committed record (docs/benchmarks) is the pinned run and the reference; this is the run of the day.
name: benchmarks
on:
  schedule:
  - cron: '41 1 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      job:
        description: The BenchmarkDotNet job (default is the record's; short is for a quick look)
        type: choice
        options: [default, short]
        default: default

permissions:
  contents: write
  packages: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  industry:
    name: Industry benchmarks, every engine on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: "Build the harness image (the results contract: the engines, the test data, one data file)"
      run: docker build --build-arg COMMIT="${GITHUB_SHA::7}" -t harness .
    - name: Run the harness image, as the central benchmark site runs it
      run: |
        python3 tools/benchmarks/v8/workloads.py Solutions/Corvus.Regex.Ecma262.Benchmarks/Industry.cs > workloads.json
        tools/benchmarks/texts.sh texts
        mkdir -p out
        docker run --rm -e JOB='${{ github.event.inputs.job || 'default' }}' -e CORVUS_REGEX_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -v "$PWD/workloads.json:/workloads.json:ro" -v "$PWD/texts:/texts:ro" -v "$PWD/out:/out" harness
        python3 tools/benchmarks/results-page/generate_site.py --data out/industry.json --out out/index.html
        head -12 out/industry.md
    - name: Publish the harness image
      # The image the central benchmark site pulls: latest from main each night, and a version tag from the release build.
      if: github.ref == 'refs/heads/main' || github.event_name == 'release'
      run: |
        echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
        image=ghcr.io/corvus-dotnet/corvus-regex-ecma262-dotnet
        docker tag harness "$image:latest" && docker push "$image:latest"
        if [ '${{ github.event_name }}' = 'release' ]; then docker tag harness "$image:${{ github.event.release.tag_name }}" && docker push "$image:${{ github.event.release.tag_name }}"; fi
    - name: Keep the run
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: industry-${{ github.run_id }}
        path: out
    - name: Publish to the site
      # The page at benchmarks/ci/ is replaced and the run's data kept under benchmarks/ci/runs/; the rest of gh-pages
      # is untouched (.github/scripts/Update-GhPages.ps1).
      if: github.ref == 'refs/heads/main' || github.event_name == 'release'
      shell: pwsh
      run: ./.github/scripts/Update-GhPages.ps1 -Mode Benchmarks -Source out -RunName "$(Get-Date -AsUTC -Format yyyy-MM-dd)-$($env:GITHUB_SHA.Substring(0, 7))"
