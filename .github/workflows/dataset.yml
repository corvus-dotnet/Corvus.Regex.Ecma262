# Runs the library over the whole ECMA-262 regular expression test data
# (github.com/corvus-dotnet/ecma262-regex-test-data): every pattern under each grammar V8 found it valid in, every
# text as UTF-16 and as UTF-8. The pass is 0 wrong answers, 0 refusals of a valid pattern, 0 acceptances of an
# invalid one and 0 matches at their limit. The data is pinned to a commit; move the pin when the data grows. The
# Linux job also runs the data as the data's own scripts write it for Unicode 13 and 18 (unicode.js apply) and for
# the grammar of ECMAScript 2020 (edition.js apply), with the runner set to match, and makes the generated Unicode data
# again from the Unicode Character Database, failing unless it is the checked-in data. It also reads what every
# released version wrote with this library (tools/compatibility/Test-GoldenImages.ps1). The tests and the data also run
# on arm64 and on x86-64 without AVX2, the vector paths the Linux job does not take.
name: dataset
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    name: ECMA-262 test data
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: Install the Rust toolchain that check-tables.ps1 runs regress's gen-unicode under
      run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
    - name: The generated Unicode data is what its sources make
      # The tables of Unicode 13, 17 and 18, the properties of strings and the property names of ECMAScript 2020, made
      # again from the Unicode Character Database, regress's gen-unicode and the test data (tools/unicode).
      shell: pwsh
      run: ./tools/unicode/check-tables.ps1 -Properties ecma262-regex-test-data/es2020-properties.json -WorkDirectory "$env:RUNNER_TEMP/unicode-check"
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Build the runner
      run: dotnet build Solutions/Corvus.Regex.Ecma262.DatasetRunner/Corvus.Regex.Ecma262.DatasetRunner.csproj -c Release
    - name: Run the data
      run: ./Solutions/Corvus.Regex.Ecma262.DatasetRunner/bin/Release/net10.0/Corvus.Regex.Ecma262.DatasetRunner ecma262-regex-test-data/data wrong-cases.tsv
    - name: Read what every release wrote (the golden check)
      # Each released version's images and generated holders, for a fixed sample of the data, written by that
      # version's own source package and read by this library (docs/plan/image-compatibility.md).
      shell: pwsh
      run: ./tools/compatibility/Test-GoldenImages.ps1 -Data ecma262-regex-test-data/data -WorkDirectory "$env:RUNNER_TEMP/golden"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.22.1'
    - name: Run the data for other versions of Unicode and for ECMAScript 2020
      shell: pwsh
      run: |
        $runner = './Solutions/Corvus.Regex.Ecma262.DatasetRunner/bin/Release/net10.0/Corvus.Regex.Ecma262.DatasetRunner'
        $data = 'ecma262-regex-test-data'
        $runs = @(
            @{ Name = 'unicode-13'; Make = @('unicode.js', 'apply', '13.0'); Options = @('--unicode', '13') },
            @{ Name = 'unicode-18'; Make = @('unicode.js', 'apply', '18.0'); Options = @('--unicode', '18') },
            @{ Name = 'es2020'; Make = @('edition.js', 'apply'); Options = @('--edition', 'es2020') },
            @{ Name = 'es2020-unicode-13'; Make = @('edition.js', 'apply'); Version = '13.0'; Options = @('--edition', 'es2020', '--unicode', '13') }
        )
        $failed = @()
        foreach ($run in $runs) {
            $out = Join-Path $env:RUNNER_TEMP $run.Name
            if ($run.Make[0] -eq 'unicode.js') {
                node "$data/unicode.js" apply $run.Make[2] $out "$data/data"
            }
            else {
                # An empty version is the data's own Unicode.
                $version = if ($run.Version) { $run.Version } else { '' }
                node "$data/edition.js" apply $out $version "$data/data"
            }

            if ($LASTEXITCODE -ne 0) { throw "The data for $($run.Name) was not written." }
            & $runner $out "wrong-cases-$($run.Name).tsv" '*.jsonl' both @($run.Options)
            if ($LASTEXITCODE -ne 0) { $failed += $run.Name }
        }

        if ($failed.Count -gt 0) { throw "Wrong: $($failed -join ', ')" }
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases
        path: |
          wrong-cases*.tsv
          ${{ runner.temp }}/golden/wrong-cases-golden-*.tsv

  vector-paths:
    # The tests and the data over the vector paths the Linux job does not take: arm64 (AdvSimd, and no 256-bit
    # vectors) and x86-64 without AVX2 (SSE2 and 128-bit vectors), where, for one, the packed search over UTF-16
    # narrows sixteen units at a step in place of thirty-two.
    name: Tests and data (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: arm64
          runner: ubuntu-24.04-arm
          avx2: '1'
        - name: x64 without AVX2
          runner: ubuntu-latest
          avx2: '0'
    env:
      DOTNET_EnableAVX2: ${{ matrix.avx2 }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
        path: ecma262-regex-test-data
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Build the tests and the runner
      run: |
        dotnet build Solutions/Corvus.Regex.Ecma262.Tests/Corvus.Regex.Ecma262.Tests.csproj -c Release -f net10.0
        dotnet build Solutions/Corvus.Regex.Ecma262.DatasetRunner/Corvus.Regex.Ecma262.DatasetRunner.csproj -c Release -f net10.0
    - name: Test
      run: dotnet Solutions/Corvus.Regex.Ecma262.Tests/bin/Release/net10.0/Corvus.Regex.Ecma262.Tests.dll
    - name: Run the data
      run: ./Solutions/Corvus.Regex.Ecma262.DatasetRunner/bin/Release/net10.0/Corvus.Regex.Ecma262.DatasetRunner ecma262-regex-test-data/data wrong-cases.tsv
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.runner }}-avx2-${{ matrix.avx2 }}
        path: wrong-cases*.tsv

  dataset-net481:
    # The same data over the netstandard2.0 build of the library, on .NET Framework 4.8.1: the plain paths the modern
    # build never takes.
    name: ECMA-262 test data (net481)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
        path: ecma262-regex-test-data
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Build the runner
      run: dotnet build Solutions/Corvus.Regex.Ecma262.DatasetRunner/Corvus.Regex.Ecma262.DatasetRunner.csproj -c Release -f net481
    - name: Run the data
      run: ./Solutions/Corvus.Regex.Ecma262.DatasetRunner/bin/Release/net481/Corvus.Regex.Ecma262.DatasetRunner.exe ecma262-regex-test-data/data wrong-cases-net481.tsv
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-net481
        path: wrong-cases-net481.tsv
