# Publishes Solutions/Corvus.Regex.Ecma262.AotProfileTests with native AOT and a static profile, and runs it: every
# answer must be right. A profile recorded on the JIT steers the AOT compiler's inlining and devirtualisation, and the
# profile that Corvus.Text.Json 5.8.5 shipped made it compile the automaton's closure wrongly (the project file says
# how). The job also publishes and runs the AOT sample.
name: aot
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aot:
    name: Native AOT with a static profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json
    - name: Publish and run the profile tests
      run: |
        dotnet publish Solutions/Corvus.Regex.Ecma262.AotProfileTests -c Release -o "$RUNNER_TEMP/aot-profile"
        "$RUNNER_TEMP/aot-profile/Corvus.Regex.Ecma262.AotProfileTests"
    - name: Publish and run the AOT sample
      run: |
        dotnet publish Solutions/Corvus.Regex.Ecma262.AotSample -c Release -o "$RUNNER_TEMP/aot-sample"
        "$RUNNER_TEMP/aot-sample/Corvus.Regex.Ecma262.AotSample"
